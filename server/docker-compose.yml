name: mangalate
x-worker: &worker
  restart: unless-stopped
  env_file: .env
  environment:
    MANGALATE_API_KEY_FILE: /run/secrets/provider_key
  secrets: [provider_key]
  volumes:
    - models:/app/models
    - huggingface:/root/.cache/huggingface
  expose: ["8001"]
  networks:
    default:
      aliases: [translator]

services:
  translator-cpu:
    <<: *worker
    profiles: [cpu]
    build: {context: ., dockerfile: Dockerfile.worker, target: cpu}
  translator-gpu:
    <<: *worker
    profiles: [gpu]
    build: {context: ., dockerfile: Dockerfile.worker, target: gpu}
    environment:
      MANGALATE_API_KEY_FILE: /run/secrets/provider_key
      MANGALATE_USE_GPU: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  gateway:
    profiles: [cpu, gpu, amd-rocm]
    build: {context: ., dockerfile: Dockerfile.gateway}
    restart: unless-stopped
    env_file: .env
    environment:
      MANGALATE_KEY_FILE: /run/secrets/mangalate_key
      MANGALATE_UPSTREAM: http://translator:8001
    secrets: [mangalate_key]
    ports: ["${MANGALATE_BIND:-127.0.0.1}:5003:5003"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5003/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
  translator-amd:
    <<: *worker
    profiles: [amd-rocm]
    build: {context: ., dockerfile: Dockerfile.worker, target: rocm}
    environment:
      MANGALATE_API_KEY_FILE: /run/secrets/provider_key
      MANGALATE_USE_GPU: "true"
      MANGALATE_ACCELERATOR: amd-rocm
    devices: ["/dev/kfd:/dev/kfd", "/dev/dri:/dev/dri"]
    group_add: ["video"]
    security_opt: ["seccomp:unconfined"]
    shm_size: 4g

secrets:
  mangalate_key:
    file: ${MANGALATE_KEY_FILE:-./secrets/mangalate_key.txt}
  provider_key:
    file: ${MANGALATE_API_KEY_FILE:-./secrets/provider_key.txt}
volumes:
  models:
  huggingface:
