name: Build Mangalate APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  verify-server:
    uses: ./.github/workflows/server.yml
    permissions:
      contents: read

  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.MANGALATE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mangalate.jks"
            echo "MIHON_GITHUB_RELEASE=true" >> "$GITHUB_ENV"
            echo "storeFile=$RUNNER_TEMP/mangalate.jks" >> "$GITHUB_ENV"
          fi

      - name: Build app
        env:
          MANGALATE_VERSION_CODE: ${{ github.run_number }}
          storePassword: ${{ secrets.MANGALATE_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.MANGALATE_KEYSTORE_PASSWORD }}
          keyAlias: mangalate
        run: ./gradlew :app:assembleRelease -Pdist=local --stacktrace

      - name: Test bubble geometry and Portuguese lettering
        run: ./gradlew :app:testDebugUnitTest --tests 'app.mangalate.local.*' --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/Mangalate-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist/Mangalate-armeabi-v7a.apk
          cp app/build/outputs/apk/release/app-universal-release.apk dist/Mangalate-universal.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mangalate-${{ github.run_number }}
          path: dist/*.apk

  publish:
    needs: [build, verify-server]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Mangalate-${{ github.run_number }}
          path: dist
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "Mangalate 0.5.2 (build ${{ github.run_number }})" \
            --notes "Foco em tradução offline e servidor. Gemini e DeepL diretos saem da seleção principal; limpeza local da 0.5.0 preservada. Docker com instalação guiada, caminho da chave Mangalate e perfis Básico/BYOK. BYOK usa servidor e API do próprio usuário, sem cobrança ou comissão Mangalate. Colab revisado para tradução interativa de capítulos, exportando CBZ e pacote de revisão sem túnel/keepalive. O acabamento automático exige revisão visual; não há garantia de perfeição de scan humano. APK de ${GITHUB_SHA::7}. Baixe **Mangalate-arm64-v8a.apk** para celulares atuais ou **Mangalate-universal.apk**." \
            --latest
