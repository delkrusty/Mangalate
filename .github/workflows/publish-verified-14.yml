name: Publish verified Mangalate build 14

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.repository == 'delkrusty/Mangalate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Verify both successful builds and release scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38354922271" > native.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38502915561" > server.json
          jq -e '.status=="completed" and .conclusion=="success"' native.json
          jq -e '.status=="completed" and .conclusion=="success" and .head_sha=="95110875925aad8905b1c4a4f437d5a3a708fae0"' server.json
          native_sha=$(jq -r .head_sha native.json)
          server_sha=$(jq -r .head_sha server.json)
          # Only server/docs/CI changed after the signed Android build.
          changed=$(git diff --name-only "$native_sha" "$server_sha" | rg -v '^(server/|\.github/)|\.md$' || true)
          test -z "$changed"
          # This recovery workflow itself must not alter the verified runtime.
          changed=$(git diff --name-only "$server_sha" HEAD | rg -v '^\.github/workflows/publish-verified-14.yml$' || true)
          test -z "$changed"
          gh api "repos/$GITHUB_REPOSITORY/releases/412299211" > release.json
          jq -e '.tag_name=="build-14" and .draft==true and (.assets|length)==0 and .target_commitish=="95110875925aad8905b1c4a4f437d5a3a708fae0"' release.json
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: delkrusty/Mangalate
          run-id: 38354922271
          name: Mangalate-14
          path: dist
      - name: Confirm APK checksum and upload from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "80025e98528e7f940d49bdea540439364eaefc360f5a821995a6de9ae36d6207  dist/Mangalate-arm64-v8a.apk" | sha256sum --check
          gh release upload build-14 dist/*.apk --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/412299211" --jq '.assets[]|{name,size}'
          count=$(gh api "repos/$GITHUB_REPOSITORY/releases/412299211" --jq '.assets|length')
          test "$count" = "3"
          gh release edit build-14 --repo "$GITHUB_REPOSITORY" --draft=false --latest
