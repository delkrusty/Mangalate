name: Verify ML Kit release runtime

on:
  workflow_dispatch:
  push:
    branches: [fix-translation-v5]

permissions:
  contents: read

concurrency:
  group: mlkit-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile actual minified release and its runtime tests
        run: ./gradlew :app:assembleRelease :app:assembleReleaseAndroidTest -Pdist=local -PruntimeCheck=true --stacktrace
      - name: Test DeepL transport and unchanged bubble rendering
        run: ./gradlew :app:testDebugUnitTest --tests 'app.mangalate.local.*' --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test OCR and offline translation on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-x86_64-release.apk
            adb install -r app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -r -e class app.mangalate.local.MlKitRuntimeTest app.mangalate.test/androidx.test.runner.AndroidJUnitRunner | tee runtime-results.txt
            adb logcat -d > runtime-logcat.txt
            test "$(grep -c 'OK (3 tests)' runtime-results.txt)" -eq 1
      - name: Keep diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlkit-release-diagnostics
          path: |
            runtime-results.txt
            runtime-logcat.txt
            app/build/outputs/logs/manifest-merger-release-report.txt
            app/build/outputs/mapping/release/configuration.txt
