name: Verify Mangalate server
on:
  push:
    branches: ['candidate/**', 'melhoria/**', 'teste/**']
  workflow_dispatch:
  workflow_call:
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Free space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Gateway, wizard and notebook contract tests
        run: |
          pip install -r server/requirements-gateway.txt numpy==2.5.4 opencv-python-headless
          python -m unittest discover -s server/tests -v
      - name: Validate Compose and CPU build
        working-directory: server
        run: |
          python -c "from setup import configure;configure('basic','cpu','127.0.0.1')"
          docker compose --profile cpu config --quiet
          docker compose --profile amd-wsl config --quiet
          MANGALATE_DOMAIN=manga.example.com docker compose -f docker-compose.yml -f docker-compose.public.yml --profile cpu config --quiet
          docker compose --profile cpu build
      - name: Verify upstream imports, start and warm up real CPU pipeline
        working-directory: server
        run: |
          docker compose --profile cpu run --rm --entrypoint python translator-cpu -m pip check
          docker compose --profile cpu run --rm --entrypoint python translator-cpu -c "from manga_translator import MangaTranslator, Config; import json; from pathlib import Path; [Config(**json.loads(p.read_text())) for p in Path('/mangalate/profiles').glob('*.json')]; MangaTranslator({'kernel_size':3,'use_gpu':False,'verbose':False}); print('Upstream initialization and both profiles OK')"
          docker compose --profile cpu run --rm -v "$PWD/tests/byok_runtime.py:/mangalate/tests/byok_runtime.py:ro" --entrypoint python translator-cpu /mangalate/tests/byok_runtime.py
          docker compose --profile cpu up -d
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5003/healthz && break || sleep 2; done
          python check.py --warmup
          python -c "from PIL import Image,ImageChops; import numpy as np; p=Image.open('review/teste-traduzido.png'); o=Image.open('review/teste-original.png'); assert p.size==o.size==(900,600); assert np.asarray(p).std()>5; assert ImageChops.difference(p,o).getbbox()"
      - name: Verify same batch engine used by the Colab notebook
        working-directory: server
        run: |
          python -c "import zipfile; z=zipfile.ZipFile('review/chapter.zip','w'); z.write('review/teste-original.png','001.png'); z.close()"
          worker=$(docker compose --profile cpu ps -q translator-cpu)
          docker cp review/chapter.zip "$worker":/tmp/chapter.zip
          docker compose --profile cpu exec -T translator-cpu python /mangalate/batch.py --input /tmp/chapter.zip --output /tmp/batch-review --profile basic --diagnostics 2>&1 | tee batch.log
          # The translation must be fitted to the bubble by lettering.py, not silently fall back.
          grep -E "Bubble layout: [1-9][0-9]* of" batch.log
          ! grep -q "Bubble layout skipped" batch.log
          # The page is cleaned while the translation runs (speed.py), with the real engine.
          grep -E "Tempos: .*limpeza_antecipada=" batch.log
          ! grep -q "Limpeza antecipada falhou" batch.log
          docker compose --profile cpu exec -T translator-cpu python -c "import json; from pathlib import Path; d=Path('/tmp/batch-review/diagnostico/0001'); assert all((d/n).exists() for n in ('1-original.png','3-regioes.png','regioes.json')), list(d.iterdir()); print(json.load(open(d/'regioes.json')))"
          docker cp "$worker":/tmp/batch-review/review.json review/batch-review.json
          python -c "import json; r=json.load(open('review/batch-review.json')); assert r and r[0]['status']=='review',r; assert any(x['translation'].strip() and x['translation'].lower()!=x['original'].lower() for x in r[0]['regions']),r"
      - name: Verify bubbles cut between webtoon slices are read whole
        working-directory: server
        run: |
          python - <<'PY'
          import zipfile
          from PIL import Image, ImageDraw, ImageFont
          page = Image.new("RGB", (900, 1600), (170, 200, 230))
          draw = ImageDraw.Draw(page)
          for x in range(0, 900, 14):
              draw.line((x, 0, x, 1600), fill=(110, 140, 185), width=4)
          draw.ellipse((60, 560, 840, 1060), fill="white", outline="black", width=6)
          font = ImageFont.load_default(size=72)
          draw.text((190, 650), "Hello world!", font=font, fill="black")
          draw.text((150, 760), "Good morning!", font=font, fill="black")  # cut by the seam at y=800
          draw.text((210, 880), "See you soon.", font=font, fill="black")
          with zipfile.ZipFile("review/seam.zip", "w") as book:
              for name, box in (("001.png", (0, 0, 900, 800)), ("002.png", (0, 800, 900, 1600))):
                  page.crop(box).save("review/" + name)
                  book.write("review/" + name, name)
          PY
          worker=$(docker compose --profile cpu ps -q translator-cpu)
          docker cp review/seam.zip "$worker":/tmp/seam.zip
          docker compose --profile cpu exec -T translator-cpu python /mangalate/batch.py --input /tmp/seam.zip --output /tmp/seam-review --profile basic
          docker cp "$worker":/tmp/seam-review/review.json review/seam-review.json
          python - <<'PY'
          import json
          pages = json.load(open("review/seam-review.json"))
          print(json.dumps(pages, ensure_ascii=False, indent=1))
          assert all(p["status"] == "review" for p in pages), pages
          assert pages[0]["seams"]["below"] and pages[1]["seams"]["above"], pages
          for p in pages:
              text = " ".join(r["original"].lower() for r in p["regions"])
              assert "morning" in text, ("cut line not read whole", p["page"], text)
          PY
      - name: Diagnostics
        if: always()
        working-directory: server
        run: docker compose --profile cpu logs --tail=1000 > diagnostics.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mangalate-server-diagnostics
          path: |
            server/diagnostics.log
            server/review/*.png
            server/review/*.json
