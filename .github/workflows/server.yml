name: Verify Mangalate server
on:
  push:
    branches: [server-first]
  workflow_dispatch:
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Free space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Gateway, wizard and notebook contract tests
        run: |
          pip install -r server/requirements-gateway.txt numpy==2.5.4
          python -m unittest discover -s server/tests -v
      - name: Validate Compose and CPU build
        working-directory: server
        run: |
          python -c "from setup import configure;configure('basic','cpu','127.0.0.1')"
          docker compose --profile cpu config --quiet
          MANGALATE_DOMAIN=manga.example.com docker compose -f docker-compose.yml -f docker-compose.public.yml --profile cpu config --quiet
          docker compose --profile cpu build
      - name: Verify upstream imports, start and warm up real CPU pipeline
        working-directory: server
        run: |
          docker compose --profile cpu run --rm --entrypoint python translator-cpu -c "from manga_translator import MangaTranslator, Config; print('Upstream imports OK')"
          docker compose --profile cpu up -d
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5003/healthz && break || sleep 2; done
          python check.py --warmup
          python -c "from PIL import Image,ImageChops; p=Image.open('review/teste-traduzido.png'); assert p.size==(900,600); assert p.getbbox()"
      - name: Diagnostics
        if: always()
        working-directory: server
        run: docker compose --profile cpu logs --tail=150 > diagnostics.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mangalate-server-diagnostics
          path: |
            server/diagnostics.log
            server/review/*.png
