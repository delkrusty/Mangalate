name: BYOK live check
# Calls free provider tiers with synthetic dialogue. Needs the repository
# secrets GROQ_API_KEY and/or GEMINI_API_KEY; a missing secret is reported and
# skipped. Never runs on pull requests, so forks cannot read the secrets.
on:
  workflow_dispatch:
  push:
    branches: ['candidate/**']
    paths: ['server/tests/byok_live.py', '.github/workflows/byok-live.yml', 'server/profiles/scan-prompt.yaml']
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build CPU worker
        working-directory: server
        run: |
          python3 -c "from setup import configure;configure('basic','cpu','127.0.0.1')"
          docker compose --profile cpu build translator-cpu
      - name: Translate synthetic dialogue with Groq, Gemini and NLLB
        working-directory: server
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          docker compose --profile cpu run --rm -e GROQ_API_KEY -e GEMINI_API_KEY \
            -v "$PWD/tests/byok_live.py:/mangalate/tests/byok_live.py:ro" \
            --entrypoint python translator-cpu /mangalate/tests/byok_live.py
