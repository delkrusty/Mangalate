name: ⭐ Sugestão
description: Sugira uma melhoria para o Mangalate
labels: [sugestão]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: O que você sugere?
      description: Como o Mangalate poderia ficar melhor?
    validations:
      required: true
  - type: textarea
    id: other-details
    attributes:
      label: Outros detalhes
      description: Exemplos, prints ou links. Não inclua chaves.
