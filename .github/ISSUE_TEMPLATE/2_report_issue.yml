name: 🐞 Problema
description: Relate um erro no app ou no servidor
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Nunca** inclua a Chave Mangalate ou chaves de IA em textos, prints ou logs.
  - type: dropdown
    id: mode
    attributes:
      label: Modo de tradução
      options:
        - No celular
        - Servidor + IA
        - Capítulo inteiro no PC (batch.py) ou Colab
        - Não é sobre tradução
    validations:
      required: true
  - type: textarea
    id: reproduce-steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abri o capítulo...
        2. Toquei em 文A...
        3. Aconteceu...
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: O que aconteceu e o que você esperava
      description: Se for um problema na página traduzida, anexe um print do original e do resultado.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Versão do Mangalate
      description: Em Mais › Sobre o Mangalate.
      placeholder: "0.5.2 (build 14)"
    validations:
      required: true
  - type: input
    id: languages
    attributes:
      label: Idiomas
      placeholder: "Inglês → Português"
  - type: input
    id: device
    attributes:
      label: Celular e versão do Android
      placeholder: "Galaxy A54, Android 14"
  - type: textarea
    id: logs
    attributes:
      label: Logs (opcional)
      description: "Servidor: docker compose logs --tail=80. App: Mais › Configurações › Avançado › Compartilhar os registros de travamentos. Confira se não há chaves antes de colar."
      render: text
